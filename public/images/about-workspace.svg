<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="warmLinen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F2ECE4" />
    </linearGradient>
    <linearGradient id="terracottaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E06A26" />
      <stop offset="100%" stop-color="#F28C38" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#warmLinen)" rx="20" />

  <!-- Grid texture -->
  <g opacity="0.4" stroke="#E6DFD5" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="320" x2="600" y2="320" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
  </g>

  <!-- Modern Desk Workspace Setup Illustration -->
  <g transform="translate(50, 40)">
    <!-- Desk surface -->
    <rect x="0" y="260" width="500" height="12" rx="6" fill="#D6CBC0" />
    
    <!-- Monitor Stand -->
    <rect x="230" y="210" width="40" height="50" rx="4" fill="#8A7B70" />
    <rect x="210" y="255" width="80" height="8" rx="4" fill="#574B42" />

    <!-- Monitor Frame -->
    <rect x="110" y="30" width="280" height="180" rx="12" fill="#1C1613" stroke="#2D241E" stroke-width="3" />
    <!-- Screen Inner -->
    <rect x="118" y="38" width="264" height="164" rx="8" fill="#251E19" />

    <!-- Code on Screen -->
    <g transform="translate(130, 52)" font-family="monospace" font-size="8">
      <text x="0" y="10" fill="#E06A26">// Dinkar Kumar • AI &amp; Full Stack</text>
      <text x="0" y="22" fill="#38BDF8">const <tspan fill="#FAF8F5">engineer</tspan> = {</text>
      <text x="12" y="34" fill="#FAF8F5">name: <tspan fill="#F59E0B">"Dinkar Kumar"</tspan>,</text>
      <text x="12" y="46" fill="#FAF8F5">university: <tspan fill="#F59E0B">"Parul University"</tspan>,</text>
      <text x="12" y="58" fill="#FAF8F5">degree: <tspan fill="#F59E0B">"B.Tech CSE (AI)"</tspan>,</text>
      <text x="12" y="70" fill="#FAF8F5">batch: <tspan fill="#10B981">"2025–2029"</tspan>,</text>
      <text x="12" y="82" fill="#FAF8F5">stack: [<tspan fill="#E06A26">"React"</tspan>, <tspan fill="#2E7D5B">"Node"</tspan>, <tspan fill="#345B96">"MongoDB"</tspan>, <tspan fill="#F59E0B">"Java"</tspan>],</text>
      <text x="12" y="94" fill="#FAF8F5">status: <tspan fill="#10B981">"Ready to Build"</tspan></text>
      <text x="0" y="106" fill="#38BDF8">};</text>
      <text x="0" y="122" fill="#10B981">● System: Latency &lt; 50ms | Memory 99.8% Healthy</text>
    </g>

    <!-- Mechanical Keyboard on Desk -->
    <rect x="175" y="272" width="150" height="32" rx="4" fill="#1C1613" />
    <rect x="180" y="276" width="140" height="24" rx="2" fill="#382E27" />
    <g fill="#FAF8F5" opacity="0.6">
      <circle cx="190" cy="282" r="2" /><circle cx="198" cy="282" r="2" /><circle cx="206" cy="282" r="2" />
      <circle cx="214" cy="282" r="2" /><circle cx="222" cy="282" r="2" /><circle cx="230" cy="282" r="2" />
      <circle cx="238" cy="282" r="2" /><circle cx="246" cy="282" r="2" /><circle cx="254" cy="282" r="2" />
      <rect x="220" y="293" width="60" height="3" rx="1" fill="#E06A26" />
    </g>

    <!-- Ergonomic Mouse -->
    <rect x="340" y="274" width="22" height="30" rx="11" fill="#1C1613" />
    <line x1="351" y1="274" x2="351" y2="284" stroke="#8A7B70" stroke-width="1" />

    <!-- Coffee Mug (Inspired by Ref 1) -->
    <g transform="translate(60, 240)">
      <rect x="0" y="0" width="26" height="32" rx="4" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1" />
      <path d="M 26 8 C 34 8 34 22 26 22" fill="none" stroke="#E6DFD5" stroke-width="2.5" />
      <rect x="2" y="2" width="22" height="4" rx="2" fill="#E06A26" />
      <!-- Steam lines -->
      <path d="M 8 -4 Q 6 -12 10 -18" fill="none" stroke="#D4C7BA" stroke-width="1.5" stroke-linecap="round" />
      <path d="M 16 -6 Q 14 -14 18 -20" fill="none" stroke="#D4C7BA" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Engineering Notebook & Pen -->
    <rect x="400" y="250" width="60" height="24" rx="3" fill="#FFF3EB" stroke="#FAD8C3" stroke-width="1" transform="rotate(-6 430 262)" />
    <line x1="405" y1="256" x2="445" y2="252" stroke="#E06A26" stroke-width="1.5" stroke-linecap="round" />
    <line x1="405" y1="262" x2="435" y2="258" stroke="#8A7B70" stroke-width="1" stroke-linecap="round" />
  </g>

  <!-- Editorial Signature Pill -->
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="500" height="36" rx="18" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#10B981" />
    <text x="32" y="22" font-family="'Outfit', sans-serif" font-size="11" font-weight="bold" fill="#1C1613">
      VADODARA, GUJARAT • PARUL UNIVERSITY AI ENGINE
    </text>
    <text x="360" y="22" font-family="monospace" font-size="10" fill="#E06A26">
      22.3072° N, 73.1812° E
    </text>
  </g>
</svg>
