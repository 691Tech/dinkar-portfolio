<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradChat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F2EFEA" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D5B" />
      <stop offset="100%" stop-color="#3B9770" />
    </linearGradient>
    <filter id="softShadowChat" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1C1613" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGradChat)" rx="24" />

  <!-- App Window -->
  <g filter="url(#softShadowChat)" transform="translate(30, 24)">
    <rect width="740" height="432" rx="16" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1.5" />

    <!-- Window Titlebar -->
    <rect width="740" height="42" rx="16" fill="#FAF8F5" />
    <path d="M 0 28 L 0 42 L 740 42 L 740 28 Z" fill="#FAF8F5" />
    <line x1="0" y1="42" x2="740" y2="42" stroke="#E6DFD5" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="40" cy="21" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="56" cy="21" r="5" fill="#10B981" opacity="0.8" />
    
    <text x="310" y="26" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" fill="#1C1613">PULSE CHAT // WEBSOCKET ENGINE</text>

    <!-- App Body: Left Sidebar (Channels &amp; Users) -->
    <rect x="0" y="42" width="220" height="390" fill="#FAF8F5" />
    <line x1="220" y1="42" x2="220" y2="432" stroke="#E6DFD5" stroke-width="1" />

    <!-- Sidebar Channels -->
    <g transform="translate(20, 60)">
      <text x="0" y="14" font-family="monospace" font-size="10" font-weight="bold" fill="#8A7B70" letter-spacing="1">CHANNELS</text>
      
      <rect x="-6" y="26" width="192" height="30" rx="8" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1" />
      <text x="10" y="45" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" fill="#2E7D5B"># dev-collaboration</text>
      <circle cx="170" cy="41" r="3" fill="#10B981" />

      <text x="10" y="80" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" fill="#574B42"># general-chat</text>
      <text x="10" y="110" font-family="'Outfit', sans-serif" font-size="12" font-weight="500" fill="#574B42"># parul-univ-ai</text>

      <text x="0" y="150" font-family="monospace" font-size="10" font-weight="bold" fill="#8A7B70" letter-spacing="1">DIRECT CONVERSATIONS</text>
      
      <!-- User 1: Dinkar -->
      <g transform="translate(0, 165)">
        <circle cx="12" cy="12" r="10" fill="#1C1613" />
        <text x="8" y="16" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">DK</text>
        <circle cx="20" cy="18" r="3" fill="#10B981" />
        <text x="30" y="12" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1C1613">Dinkar Kumar</text>
        <text x="30" y="24" font-family="sans-serif" font-size="9" fill="#2E7D5B">Online (Host)</text>
      </g>

      <!-- User 2: Recruiter -->
      <g transform="translate(0, 205)">
        <circle cx="12" cy="12" r="10" fill="#E06A26" />
        <text x="8" y="16" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">TL</text>
        <circle cx="20" cy="18" r="3" fill="#10B981" />
        <text x="30" y="12" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1C1613">Engineering Lead</text>
        <text x="30" y="24" font-family="sans-serif" font-size="9" fill="#8A7B70">Active Now</text>
      </g>
    </g>

    <!-- Sidebar Telemetry footer -->
    <g transform="translate(14, 385)">
      <rect x="0" y="0" width="192" height="34" rx="8" fill="#EDF6F1" stroke="#C5E3D4" stroke-width="1" />
      <circle cx="14" cy="17" r="4" fill="#10B981" />
      <text x="24" y="16" font-family="monospace" font-size="9" font-weight="bold" fill="#185038">SOCKET.IO CONNECTED</text>
      <text x="24" y="26" font-family="monospace" font-size="8" fill="#2E7D5B">Latency: 38ms • MongoDB OK</text>
    </g>

    <!-- Right Chat Area -->
    <g transform="translate(240, 52)">
      <!-- Channel Header -->
      <text x="0" y="16" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#1C1613"># dev-collaboration</text>
      <text x="140" y="16" font-family="sans-serif" font-size="10" fill="#7A6A5E">Room ID: 691-eng-stream</text>
      <line x1="0" y1="28" x2="480" y2="28" stroke="#F4EFEA" stroke-width="1" />

      <!-- Messages Stream -->
      <!-- Message 1 from Lead -->
      <g transform="translate(0, 42)">
        <rect x="0" y="0" width="340" height="52" rx="14" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1" />
        <text x="14" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#E06A26">Engineering Lead • 19:21</text>
        <text x="14" y="36" font-family="sans-serif" font-size="11" fill="#1C1613">Hi Dinkar! Impressed with your full-stack architecture.</text>
      </g>

      <!-- Message 2 from Dinkar (Outgoing right-aligned) -->
      <g transform="translate(130, 106)">
        <rect x="0" y="0" width="340" height="66" rx="14" fill="url(#sageGrad)" />
        <text x="14" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#E8F5EE">Dinkar Kumar • 19:22</text>
        <text x="14" y="34" font-family="sans-serif" font-size="11" fill="#FFFFFF">Thank you! Built with Socket.io on Node.js and persistent</text>
        <text x="14" y="48" font-family="sans-serif" font-size="11" fill="#FFFFFF">MongoDB collections with &lt; 50ms latency.</text>
      </g>

      <!-- Message 3 from Lead -->
      <g transform="translate(0, 184)">
        <rect x="0" y="0" width="330" height="52" rx="14" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1" />
        <text x="14" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#E06A26">Engineering Lead • 19:23</text>
        <text x="14" y="36" font-family="sans-serif" font-size="11" fill="#1C1613">Are you open for Summer 2026 internships?</text>
      </g>

      <!-- Message 4 from Dinkar -->
      <g transform="translate(150, 248)">
        <rect x="0" y="0" width="320" height="52" rx="14" fill="url(#sageGrad)" />
        <text x="14" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#E8F5EE">Dinkar Kumar • 19:23</text>
        <text x="14" y="36" font-family="sans-serif" font-size="11" fill="#FFFFFF">Yes, absolutely! Open to both remote &amp; on-site roles.</text>
      </g>

      <!-- Typing Indicator -->
      <g transform="translate(4, 312)">
        <circle cx="6" cy="6" r="3" fill="#2E7D5B" opacity="0.8" />
        <circle cx="16" cy="6" r="3" fill="#2E7D5B" opacity="0.5" />
        <circle cx="26" cy="6" r="3" fill="#2E7D5B" opacity="0.3" />
        <text x="36" y="9" font-family="monospace" font-size="10" fill="#7A6A5E">Dinkar is typing...</text>
      </g>

      <!-- Message Input Bar -->
      <g transform="translate(0, 332)">
        <rect x="0" y="0" width="470" height="38" rx="19" fill="#FAF8F5" stroke="#E6DFD5" stroke-width="1" />
        <text x="16" y="24" font-family="sans-serif" font-size="11" fill="#8A7B70">Type an instant WebSocket message...</text>
        <rect x="424" y="4" width="38" height="30" rx="15" fill="#1C1613" />
        <path d="M 436 19 L 448 19 M 444 15 L 448 19 L 444 23" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

  </g>
</svg>
