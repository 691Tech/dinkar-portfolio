<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F4EFEA" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCFAF7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E06A26" />
      <stop offset="100%" stop-color="#F28C38" />
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1C1613" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bgGrad)" rx="24" />
  
  <!-- Subtle warm dot grid pattern -->
  <g opacity="0.3" fill="#8A7B70">
    <circle cx="40" cy="40" r="1.5" /><circle cx="80" cy="40" r="1.5" /><circle cx="120" cy="40" r="1.5" />
    <circle cx="40" cy="80" r="1.5" /><circle cx="80" cy="80" r="1.5" /><circle cx="120" cy="80" r="1.5" />
    <circle cx="680" cy="40" r="1.5" /><circle cx="720" cy="40" r="1.5" /><circle cx="760" cy="40" r="1.5" />
    <circle cx="680" cy="80" r="1.5" /><circle cx="720" cy="80" r="1.5" /><circle cx="760" cy="80" r="1.5" />
  </g>

  <!-- Browser Container Window -->
  <g filter="url(#softShadow)" transform="translate(30, 24)">
    <rect width="740" height="432" rx="16" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1.5" />
    
    <!-- Browser Titlebar -->
    <rect width="740" height="42" rx="16" fill="#FAF8F5" />
    <path d="M 0 28 L 0 42 L 740 42 L 740 28 Z" fill="#FAF8F5" />
    <line x1="0" y1="42" x2="740" y2="42" stroke="#E6DFD5" stroke-width="1" />
    
    <!-- Window controls -->
    <circle cx="24" cy="21" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="40" cy="21" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="56" cy="21" r="5" fill="#10B981" opacity="0.8" />
    
    <!-- URL Bar -->
    <rect x="180" y="9" width="380" height="24" rx="12" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1" />
    <text x="240" y="25" font-family="monospace" font-size="11" fill="#7A6A5E">https://ecommerce.dinkarkumar.dev/shop</text>
    <circle cx="196" cy="21" r="3" fill="#10B981" />
    <text x="206" y="25" font-family="sans-serif" font-size="9" font-weight="bold" fill="#10B981">SSL</text>

    <!-- App Header Inside Browser -->
    <g transform="translate(24, 58)">
      <text x="0" y="20" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" fill="#1C1613">NEXUS STORE</text>
      <text x="110" y="20" font-family="monospace" font-size="10" fill="#E06A26" font-weight="bold">[REACT • NODE • MONGO]</text>
      
      <!-- Search bar -->
      <rect x="290" y="4" width="220" height="26" rx="13" fill="#F4EFEA" stroke="#E6DFD5" stroke-width="1" />
      <text x="310" y="21" font-family="sans-serif" font-size="10" fill="#8A7B70">Search mechanical switches, audio...</text>
      
      <!-- Cart Badge Pill -->
      <rect x="620" y="4" width="70" height="26" rx="13" fill="url(#accentGrad)" />
      <text x="635" y="21" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Cart (3)</text>
    </g>

    <!-- Category Filter Tabs -->
    <g transform="translate(24, 102)">
      <rect x="0" y="0" width="55" height="22" rx="11" fill="#1C1613" />
      <text x="15" y="15" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">All</text>
      
      <rect x="65" y="0" width="115" height="22" rx="11" fill="#F4EFEA" stroke="#E6DFD5" stroke-width="1" />
      <text x="77" y="15" font-family="sans-serif" font-size="10" font-weight="500" fill="#574B42">Gaming Keyboards</text>
      
      <rect x="190" y="0" width="105" height="22" rx="11" fill="#F4EFEA" stroke="#E6DFD5" stroke-width="1" />
      <text x="202" y="15" font-family="sans-serif" font-size="10" font-weight="500" fill="#574B42">Studio Audio</text>

      <rect x="305" y="0" width="95" height="22" rx="11" fill="#F4EFEA" stroke="#E6DFD5" stroke-width="1" />
      <text x="317" y="15" font-family="sans-serif" font-size="10" font-weight="500" fill="#574B42">Desk Gear</text>
    </g>

    <!-- Product Cards Grid -->
    <g transform="translate(24, 140)">
      <!-- Product Card 1 -->
      <rect x="0" y="0" width="220" height="260" rx="12" fill="url(#cardGrad)" stroke="#E6DFD5" stroke-width="1" />
      <rect x="12" y="12" width="196" height="120" rx="8" fill="#F4EFEA" />
      <!-- Graphic in product 1: Keyboard silhouette -->
      <rect x="32" y="45" width="156" height="55" rx="6" fill="#1C1613" />
      <rect x="40" y="52" width="140" height="10" rx="2" fill="#E06A26" opacity="0.8" />
      <rect x="40" y="66" width="140" height="8" rx="2" fill="#D4C7BA" opacity="0.6" />
      <rect x="40" y="78" width="140" height="12" rx="2" fill="#FAF8F5" opacity="0.4" />
      
      <text x="14" y="152" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" fill="#1C1613">MX Mechanical Pro</text>
      <text x="14" y="168" font-family="sans-serif" font-size="10" fill="#7A6A5E">Cherry MX Brown • Wireless</text>
      <text x="14" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#E06A26">$79.00</text>
      <rect x="14" y="206" width="192" height="28" rx="14" fill="#1C1613" />
      <text x="75" y="224" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Add to Cart</text>

      <!-- Product Card 2 -->
      <rect x="236" y="0" width="220" height="260" rx="12" fill="url(#cardGrad)" stroke="#E6DFD5" stroke-width="1" />
      <rect x="248" y="12" width="196" height="120" rx="8" fill="#F4EFEA" />
      <!-- Graphic in product 2: Studio Headphones -->
      <circle cx="346" cy="65" r="32" fill="none" stroke="#244372" stroke-width="6" />
      <rect x="306" y="65" width="16" height="30" rx="6" fill="#1C1613" />
      <rect x="370" y="65" width="16" height="30" rx="6" fill="#1C1613" />
      <path d="M 314 65 C 314 42 378 42 378 65" fill="none" stroke="#E06A26" stroke-width="4" />

      <text x="250" y="152" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" fill="#1C1613">Hi-Fi Noise Cancel Studio</text>
      <text x="250" y="168" font-family="sans-serif" font-size="10" fill="#7A6A5E">Active ANC • 40h Battery</text>
      <text x="250" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#E06A26">$129.00</text>
      <rect x="248" y="206" width="192" height="28" rx="14" fill="#1C1613" />
      <text x="310" y="224" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Add to Cart</text>

      <!-- Right Column: Live Cart Summary Drawer -->
      <rect x="472" y="0" width="220" height="260" rx="12" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="1.5" />
      <rect x="472" y="0" width="220" height="36" rx="12" fill="#FAF8F5" />
      <text x="488" y="23" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1C1613">Shopping Cart (2 Items)</text>
      
      <!-- Cart items -->
      <g transform="translate(488, 48)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1C1613">MX Mechanical Pro</text>
        <text x="0" y="25" font-family="sans-serif" font-size="9" fill="#8A7B70">Qty: 1 × $79.00</text>
        <text x="160" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1C1613">$79</text>
        <line x1="0" y1="36" x2="190" y2="36" stroke="#F4EFEA" stroke-width="1" />
      </g>
      
      <g transform="translate(488, 96)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1C1613">Precision Type-C Hub</text>
        <text x="0" y="25" font-family="sans-serif" font-size="9" fill="#8A7B70">Qty: 1 × $35.00</text>
        <text x="160" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1C1613">$35</text>
        <line x1="0" y1="36" x2="190" y2="36" stroke="#F4EFEA" stroke-width="1" />
      </g>

      <g transform="translate(488, 150)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" fill="#7A6A5E">Subtotal:</text>
        <text x="150" y="12" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1C1613">$114.00</text>
        <text x="0" y="28" font-family="sans-serif" font-size="10" fill="#7A6A5E">Tax &amp; Shipping:</text>
        <text x="160" y="28" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10B981">Free</text>
      </g>

      <rect x="484" y="206" width="196" height="30" rx="15" fill="url(#accentGrad)" />
      <text x="532" y="225" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Proceed to Checkout →</text>
    </g>

  </g>
</svg>
