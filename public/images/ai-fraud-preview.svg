<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F5EFE8" />
    </linearGradient>
    <linearGradient id="aiCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCFAF7" />
    </linearGradient>
    <filter id="softShadowAi" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1C1613" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#aiBgGrad)" rx="24" />

  <g filter="url(#softShadowAi)" transform="translate(30, 24)">
    <rect width="740" height="432" rx="16" fill="#1C1613" stroke="#2D241E" stroke-width="1.5" />

    <!-- Titlebar -->
    <rect width="740" height="42" rx="16" fill="#251E19" />
    <path d="M 0 28 L 0 42 L 740 42 L 740 28 Z" fill="#251E19" />
    <line x1="0" y1="42" x2="740" y2="42" stroke="#382E27" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="40" cy="21" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="56" cy="21" r="5" fill="#10B981" opacity="0.8" />
    <text x="260" y="26" font-family="monospace" font-size="11" fill="#D4C7BA">neural-shield // AUTOENCODER ANOMALY RADAR</text>

    <!-- App Inner Area -->
    <g transform="translate(24, 60)" font-family="monospace">
      <!-- Left: Loss Curve &amp; Neural Topology (360 wide) -->
      <g>
        <rect x="0" y="0" width="340" height="340" rx="12" fill="#251E19" stroke="#382E27" stroke-width="1" />
        <text x="16" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" fill="#E06A26">Reconstruction Loss Spectrum</text>
        <text x="16" y="42" font-size="9" fill="#8A7B70">Threshold: MSE &gt; 0.042 (Flagged as Fraud)</text>

        <!-- Chart Grid -->
        <line x1="30" y1="60" x2="310" y2="60" stroke="#382E27" stroke-width="1" stroke-dasharray="2" />
        <line x1="30" y1="110" x2="310" y2="110" stroke="#382E27" stroke-width="1" stroke-dasharray="2" />
        <line x1="30" y1="160" x2="310" y2="160" stroke="#382E27" stroke-width="1" stroke-dasharray="2" />
        <line x1="30" y1="210" x2="310" y2="210" stroke="#382E27" stroke-width="1" stroke-dasharray="2" />

        <!-- Anomaly Threshold Line (Red) -->
        <line x1="30" y1="130" x2="310" y2="130" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4" />
        <text x="210" y="125" font-size="8" fill="#EF4444" font-weight="bold">CRITICAL THRESHOLD (0.042)</text>

        <!-- Wave / Loss curves -->
        <!-- Normal Transactions Curve (Emerald) -->
        <path d="M 30 190 Q 60 170 90 185 T 150 180 T 210 195 T 270 175 T 310 185" fill="none" stroke="#10B981" stroke-width="2.5" />
        
        <!-- Fraud Spike (Red) -->
        <path d="M 170 185 L 185 80 L 200 190" fill="none" stroke="#EF4444" stroke-width="2.5" />
        <circle cx="185" cy="80" r="5" fill="#EF4444" />
        <rect x="145" y="55" width="80" height="20" rx="4" fill="#EF4444" />
        <text x="152" y="69" font-size="9" fill="#FFFFFF" font-weight="bold">FRAUD DETECTED</text>

        <!-- Model Stats -->
        <g transform="translate(16, 240)">
          <rect x="0" y="0" width="308" height="85" rx="8" fill="#1C1613" />
          <text x="12" y="20" font-size="9" fill="#8A7B70">MODEL ARCHITECTURE: DEEP AUTOENCODER</text>
          <text x="12" y="38" font-size="10" fill="#FAF8F5">Layers: [29 → 14 → 7 → 14 → 29]</text>
          <text x="12" y="54" font-size="10" fill="#10B981">Precision: 98.4% &#8226; Recall: 96.2%</text>
          <text x="12" y="70" font-size="9" fill="#E06A26">Latency: 14ms / transaction inference</text>
        </g>
      </g>

      <!-- Right: Real-Time Transaction Stream (340 wide) -->
      <g transform="translate(360, 0)">
        <rect x="0" y="0" width="330" height="340" rx="12" fill="#251E19" stroke="#382E27" stroke-width="1" />
        <text x="16" y="26" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold" fill="#FAF8F5">Live Transaction Stream</text>
        <text x="220" y="26" font-size="9" fill="#10B981">● STREAM ACTIVE</text>

        <!-- Feed item 1 (Normal) -->
        <g transform="translate(16, 45)">
          <rect x="0" y="0" width="298" height="52" rx="8" fill="#1C1613" stroke="#10B981" stroke-width="1" />
          <text x="12" y="18" font-size="10" fill="#FAF8F5" font-weight="bold">TXN-49219 • $42.50 (Grocery)</text>
          <text x="12" y="34" font-size="9" fill="#8A7B70">MSE: 0.008 &#8226; Verified Normal</text>
          <rect x="235" y="14" width="52" height="18" rx="9" fill="#10B981" />
          <text x="245" y="27" font-size="8" fill="#FFFFFF" font-weight="bold">PASS</text>
        </g>

        <!-- Feed item 2 (Flagged Fraud) -->
        <g transform="translate(16, 108)">
          <rect x="0" y="0" width="298" height="58" rx="8" fill="#1C1613" stroke="#EF4444" stroke-width="1.5" />
          <text x="12" y="18" font-size="10" fill="#EF4444" font-weight="bold">TXN-49220 • $1,890.00 (Overseas)</text>
          <text x="12" y="34" font-size="9" fill="#F87171">MSE: 0.128 &gt; Threshold (HIGH RISK)</text>
          <text x="12" y="48" font-size="8" fill="#8A7B70">Anomaly vector: [V12, V14, V17 abnormal]</text>
          <rect x="235" y="14" width="52" height="18" rx="9" fill="#EF4444" />
          <text x="242" y="27" font-size="8" fill="#FFFFFF" font-weight="bold">BLOCKED</text>
        </g>

        <!-- Feed item 3 (Normal) -->
        <g transform="translate(16, 178)">
          <rect x="0" y="0" width="298" height="52" rx="8" fill="#1C1613" stroke="#10B981" stroke-width="1" />
          <text x="12" y="18" font-size="10" fill="#FAF8F5" font-weight="bold">TXN-49221 • $15.00 (Streaming Sub)</text>
          <text x="12" y="34" font-size="9" fill="#8A7B70">MSE: 0.004 &#8226; Verified Normal</text>
          <rect x="235" y="14" width="52" height="18" rx="9" fill="#10B981" />
          <text x="245" y="27" font-size="8" fill="#FFFFFF" font-weight="bold">PASS</text>
        </g>

        <!-- Pipeline Status -->
        <g transform="translate(16, 250)">
          <rect x="0" y="0" width="298" height="75" rx="8" fill="#1C1613" />
          <text x="12" y="18" font-size="9" fill="#8A7B70">BACKEND: FLASK REST API + KERAS</text>
          <text x="12" y="36" font-size="9" fill="#FAF8F5">Client: React Dashboard with WebSocket feed</text>
          <text x="12" y="54" font-size="9" fill="#E06A26">Trained on Kaggle Credit Card Fraud Dataset (284K TXNs)</text>
        </g>
      </g>
    </g>

  </g>
</svg>
